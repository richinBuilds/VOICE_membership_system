name: Java CI/CD with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          MAILTRAP_USERNAME: test
          MAILTRAP_PASSWORD: test
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          PAYPAL_CLIENT_ID: test-client-id
          PAYPAL_CLIENT_SECRET: test-client-secret
        run: ./mvnw clean package -Dspring.profiles.active=test

      - name: Print surefire reports on failure
        if: failure()
        run: |
          echo "=== Surefire reports (first 400 lines each) ==="
          find target/surefire-reports -type f -name "*.txt" -o -name "*.xml" | while read f; do
            echo "--- $f ---"
            sed -n '1,400p' "$f"
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voice-membership:v5